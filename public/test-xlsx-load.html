<!DOCTYPE html>
<html>
<head>
    <title>Test XLSX Library Loading</title>
</head>
<body>
    <h1>XLSX Library Test</h1>
    <p id="status">Loading...</p>
    
    <script src="http://localhost:8000/js/xlsx.min.js"></script>
    <script>
        setTimeout(() => {
            if (typeof XLSX !== 'undefined') {
                document.getElementById('status').innerHTML = '✓ XLSX library loaded successfully!<br/>Version info: ' + XLSX.version;
            } else {
                document.getElementById('status').innerHTML = '✗ XLSX library NOT loaded!';
            }
        }, 2000);
    </script>
</body>
</html>
