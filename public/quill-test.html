<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quill Insert Test</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        body { font-family: Arial; margin: 20px; }
        #editor { height: 300px; border: 1px solid #ccc; margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; border: 1px solid #ccc; }
        button { padding: 10px 20px; margin: 10px 0; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .log { background: #f0f0f0; border: 1px solid #ccc; padding: 10px; margin: 10px 0; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .success { color: green; }
        .error { color: red; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <h1>🔬 Quill Table Insert Diagnostic Test</h1>
    
    <h2>Test 1: Quill Instance</h2>
    <div id="editor"></div>
    <button onclick="testInsert1()">Test: Insert Table (Method 1 - Direct innerHTML)</button>
    <button onclick="testInsert2()">Test: Insert Table (Method 2 - dangerouslyPasteHTML)</button>
    <button onclick="syncToTextarea()">Sync Quill to Textarea</button>
    
    <h2>Textarea (hidden field for form)</h2>
    <textarea id="description" placeholder="Table HTML should appear here after sync"></textarea>
    
    <h2>Console Logs</h2>
    <div id="logs" class="log"></div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const logsDiv = document.getElementById('logs');

        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(msg);
        }

        const quillInstance = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Select test to insert table...'
        });

        log('✓ Quill initialized', 'success');

        function convertToHtmlTable(data) {
            let html = '<table style="width:100%; border-collapse: collapse; margin: 1rem 0; border: 1px solid #ccc;">';
            
            data.forEach((row, rowIndex) => {
                const isHeader = rowIndex === 0;
                const bgColor = isHeader ? '#3b82f6' : (rowIndex % 2 === 0 ? '#fff' : '#f9f9f9');
                
                html += '<tr>';
                row.forEach((cell) => {
                    const tag = isHeader ? 'th' : 'td';
                    html += `<${tag} style="border: 1px solid #ccc; padding: 8px; background-color: ${bgColor}; color: ${isHeader ? '#fff' : '#000'}; font-weight: ${isHeader ? 'bold' : 'normal'};">`;
                    html += String(cell || '');
                    html += `</${tag}>`;
                });
                html += '</tr>';
            });
            
            html += '</table>';
            return html;
        }

        function testInsert1() {
            log('=== TEST 1: Direct innerHTML ===', 'info');
            
            const sampleData = [
                ['Nama', 'Lantai', 'Kapasitas'],
                ['Ruang A', '1', '20'],
                ['Ruang B', '2', '25']
            ];

            const htmlTable = convertToHtmlTable(sampleData);
            log(`Generated HTML: ${htmlTable.substring(0, 100)}...`, 'info');
            log(`HTML length: ${htmlTable.length} bytes`, 'info');

            try {
                let currentContent = quillInstance.root.innerHTML;
                log(`Current content: "${currentContent}"`, 'info');

                let newContent;
                if (currentContent === '<p><br></p>') {
                    newContent = htmlTable;
                    log('Replacing empty content', 'info');
                } else {
                    newContent = currentContent + '<p><br></p>' + htmlTable;
                    log('Appending to existing content', 'info');
                }

                log(`Setting innerHTML... (${newContent.length} bytes)`, 'info');
                quillInstance.root.innerHTML = newContent;

                log('Calling quillInstance.update()', 'info');
                quillInstance.update();

                setTimeout(() => {
                    const finalHTML = quillInstance.root.innerHTML;
                    log(`Final HTML length: ${finalHTML.length}`, 'info');
                    log(`Contains <table>: ${finalHTML.includes('<table') ? 'YES' : 'NO'}`, finalHTML.includes('<table') ? 'success' : 'error');
                    log(`Final HTML preview: ${finalHTML.substring(0, 150)}...`, 'info');
                    
                    if (finalHTML.includes('<table')) {
                        log('✓ TEST 1 PASSED: Table inserted successfully!', 'success');
                    } else {
                        log('✗ TEST 1 FAILED: Table not in final HTML!', 'error');
                    }
                }, 50);

            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }

        function testInsert2() {
            log('=== TEST 2: dangerouslyPasteHTML ===', 'info');
            
            const sampleData = [
                ['Nama', 'Lantai', 'Kapasitas'],
                ['Ruang C', '3', '30'],
                ['Ruang D', '4', '35']
            ];

            const htmlTable = convertToHtmlTable(sampleData);
            log(`Generated HTML: ${htmlTable.substring(0, 100)}...`, 'info');

            try {
                log('Using dangerouslyPasteHTML method...', 'info');
                const index = quillInstance.getLength() - 1;
                log(`Insert index: ${index}`, 'info');

                quillInstance.insertText(index, '\n');
                log('Inserted line break', 'info');

                quillInstance.clipboard.dangerouslyPasteHTML(quillInstance.getLength() - 1, htmlTable);
                log('Called dangerouslyPasteHTML', 'info');

                setTimeout(() => {
                    const finalHTML = quillInstance.root.innerHTML;
                    log(`Final HTML length: ${finalHTML.length}`, 'info');
                    log(`Contains <table>: ${finalHTML.includes('<table') ? 'YES' : 'NO'}`, finalHTML.includes('<table') ? 'success' : 'error');
                    
                    if (finalHTML.includes('<table')) {
                        log('✓ TEST 2 PASSED: Table inserted!', 'success');
                    } else {
                        log('✗ TEST 2 FAILED: Table not in result!', 'error');
                    }
                }, 50);

            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }

        function syncToTextarea() {
            log('=== Syncing Quill to Textarea ===', 'info');
            
            const content = quillInstance.root.innerHTML;
            log(`Content to sync: ${content.substring(0, 100)}...`, 'info');
            log(`Content length: ${content.length} bytes`, 'info');

            document.getElementById('description').value = content;

            log('✓ Content synced to textarea', 'success');
            log(`Textarea now contains: ${document.getElementById('description').value.substring(0, 100)}...`, 'info');
        }

        log('Ready for testing. Click buttons above to test different insert methods.', 'success');
    </script>
</body>
</html>
