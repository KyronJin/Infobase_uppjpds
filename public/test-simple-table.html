<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Table Test</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        #editor { height: 300px; background: white; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    
<h1>Test: Excel Table Insert to Quill</h1>

<div class="section">
    <h3>Step 1: Test Quill Instance</h3>
    <button onclick="testQuill()">Create Quill Editor</button>
    <p id="quillStatus">Status: Not initialized</p>
</div>

<div class="section">
    <h3>Step 2: Quill Editor</h3>
    <div id="editor"></div>
    <p><small id="editorContent"></small></p>
</div>

<div class="section">
    <h3>Step 3: Insert Table</h3>
    <button onclick="insertTableTest()">Insert Test Table</button>
    <button onclick="getContent()">Show Content</button>
    <button onclick="clearEditor()">Clear</button>
</div>

<div class="section">
    <h3>Result:</h3>
    <div id="result" class="result">Click buttons above...</div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    let quill = null;
    
    function testQuill() {
        if (!quill) {
            quill = new Quill('#editor', {
                theme: 'snow',
                placeholder: 'Test area...'
            });
            document.getElementById('quillStatus').innerHTML = '<span style="color:green">✓ Quill initialized</span>';
            console.log('Quill instance created:', quill);
        }
    }
    
    function insertTableTest() {
        if (!quill) {
            alert('Initialize Quill first!');
            return;
        }
        
        console.log('Inserting table...');
        
        const tableHtml = `
            <table style="width:100%; border-collapse: collapse; margin: 1rem 0; border: 1px solid #ccc;">
                <tr>
                    <th style="border: 1px solid #ccc; padding: 8px; background-color: #3b82f6; color: #fff; font-weight: bold;">Nama</th>
                    <th style="border: 1px solid #ccc; padding: 8px; background-color: #3b82f6; color: #fff; font-weight: bold;">Umur</th>
                    <th style="border: 1px solid #ccc; padding: 8px; background-color: #3b82f6; color: #fff; font-weight: bold;">Kota</th>
                </tr>
                <tr>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #fff;">Budi</td>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #fff;">25</td>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #fff;">Jakarta</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #f9f9f9;">Ani</td>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #f9f9f9;">23</td>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #f9f9f9;">Bandung</td>
                </tr>
                <tr>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #fff;">Citra</td>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #fff;">28</td>
                    <td style="border: 1px solid #ccc; padding: 8px; background-color: #fff;">Surabaya</td>
                </tr>
            </table>
        `;
        
        try {
            const index = quill.getLength() - 1;
            quill.insertText(index, '\n');
            quill.clipboard.dangerouslyPasteHTML(index + 1, tableHtml);
            document.getElementById('result').innerHTML = '<span style="color:green">✓ Table inserted successfully!</span>';
            console.log('Table inserted');
        } catch (error) {
            document.getElementById('result').innerHTML = '<span style="color:red">✗ Error: ' + error.message + '</span>';
            console.error('Error:', error);
        }
    }
    
    function getContent() {
        if (!quill) {
            alert('Initialize Quill first!');
            return;
        }
        
        const html = quill.root.innerHTML;
        const preview = html.substring(0, 200).replace(/</g, '&lt;').replace(/>/g, '&gt;');
        
        document.getElementById('result').innerHTML = `
            <strong>HTML Content (first 200 chars):</strong><br>
            <code>${preview}...</code><br><br>
            <strong>Total length:</strong> ${html.length} chars<br>
            <strong>Contains table:</strong> ${html.includes('<table') ? 'YES ✓' : 'NO ✗'}
        `;
        console.log('Full content length:', html.length);
        console.log('Has table:', html.includes('<table'));
    }
    
    function clearEditor() {
        if (quill) {
            quill.setText('');
            document.getElementById('result').innerHTML = 'Cleared';
        }
    }
    
    // Auto initialize on load
    window.addEventListener('load', () => {
        setTimeout(testQuill, 500);
    });
</script>

</body>
</html>
